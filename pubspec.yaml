name: rapunzel
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  table_calendar: ^3.0.9
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon.jpg   # 👈 make sure this exists

# 🔥 IMPORTANT: THIS MUST BE OUTSIDE flutter
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.jpg"